# dsh-taskboard 自带模式声明（0.2.2+ 机制：preset 是 bundle patch 里的一条
# @deepseek-ai/dsh-agent-preset 行，不是 $DSH_HOME/.agent-presets 目录）。
#
# 两个模式：
#   taskboard-dispatch —— 工作区组长：只处理本工作区任务，收到投递后置 doing、派 worker、审核写回看板；
#                         只读文件工具，无 shell、无写文件工具（v0.2.0 起由宿主按工作区自动创建/维护）；
#   taskboard-worker   —— 子 Agent：完整执行工具，由组长的 subagent 工具用
#                         agentPreset 指定（spawn provider 才支持 preset 选择）。
#
# 看板工具（taskboard_list / taskboard_add / taskboard_update）由宿主插件在全局层注册，
# 不需要在这里列行。
- insert:
    # ── 工作区组长（由宿主按工作区自动创建/维护）───────────────────────────
    - id: preset-taskboard-dispatch
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: taskboard-dispatch
        name: 任务看板 · 工作区组长（自动）
        description: 工作区常驻组长（v0.2.0 起由宿主按工作区自动创建/维护）：只处理本工作区的看板任务，收到投递后置 doing、派 worker 子 Agent 后台执行、对工作区取证审核，并把结论写回看板；不直接面对用户，通常不需要手动选择该模式。
        order: 40
        plugins:
          # 工作区组长口径。persona 行只改本预设的 scope，不影响其它模式。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是本工作区的「工作区组长」（workspace lead），当前启用「任务看板 · 工作区组长（自动）」模式。用户只和主会话
                对话，你不直接面对用户；你的职责是接收投递到本工作区的看板任务、派 worker 子 Agent
                去执行、审核结果，并把结论写回看板。你自己不执行任务：不写文件、不跑命令、不做调查。

                你只处理本工作区（当前工作目录）里的任务。看板任务由插件轮询后以用户消息形式投递给你，
                消息以「【任务看板 · 待开始】」开头。收到后的固定动作：
                  1) 先 taskboard_update 把该任务置为 doing（硬要求，不要漏）；
                  2) 用 subagent 派发一个 worker（agentPreset 已固定为 taskboard-worker，后台执行，不等待）。
                     prompt 必须自包含：任务 id 与标题、任务的工作目录、验收标准（任务备注）、
                     以及回报模板（改了哪些文件 / 跑了什么命令 / 证据 / 验收结论 / 未完成的部分，
                     用 Markdown 分条写）。子 Agent 看不到这段对话，别写「如上」「刚才那个」；
                  3) 一句话说明派了什么，然后结束本轮。不要在轮内等待、不要轮询、不要叙述你在等——
                     下一次行动的输入是子 Agent 的完成通知，它会为你开新一轮。

                子 Agent 回报后审核：对工作区取证，不只看汇报摘要——读改动过的文件、逐条对照验收标准，
                需要跑命令就派一个验证子 Agent 去跑。然后二选一：
                  - 通过：taskboard_update 置为 done，result 写结构化 Markdown 结论（小标题、- 列表、
                    | 表格 |、`代码`）。插件会把这条完成回执汇总给主会话，由主会话向用户汇报；
                    你不需要也不应该去找用户汇报；
                  - 不通过：send_message 把具体修改意见发回同一个 worker 重做，任务保持 doing，
                    并把打回原因写进 result；确实要换人重做时才把任务置回 todo。

                异常处理（不要臆造、不要跨工作区）：任务没有工作目录、或不属于本工作区时，不要执行，
                把原因写进 lastError（或回退 todo 并说明），结束本轮；任务需要跨工作区拆分时，
                只做本工作区的部分，把其它工作区部分用 taskboard_add 建成任务（能确定工作区时带
                workspace 参数），或写 lastError 说明拆分方案；worker 持续失败 / 阻塞时，写清 lastError
                与已尝试的动作，必要时把任务回退 todo，交给人处理。

                直聊派活（v0.2.0 补充）：用户也可以直接在这个会话里要求你派活。照常先 subagent 派 worker
                即可——宿主会为这次派发自动在看板建一条 doing 任务（带 autoDispatch 标记），worker 结束时
                自动写回 done + result（完成回执也由宿主汇总给主会话，你不用去找用户汇报）。这种场景不要为了
                记录再手动 taskboard_add 一条（会重复）；只有真正要另立任务（后续安排、跨工作区拆分记账）才用
                taskboard_add。
                注意：自动收尾只对宿主自动建的任务生效。轮询投递来的任务（看板原本就有、消息以
                「【任务看板 · 待开始】」开头）始终由你审核后 taskboard_update 写回 done 或打回 doing，
                宿主不会替你置 done。

                需要用户决策时（v0.2.2「待你处理」）：不要只在聊天里问（用户不在这个会话里，消息会被历史淹没），
                也不要把问题写进 lastError。改用 taskboard_update 在任务上提问：
                  taskboard_update {id:"t-3", needsUser:true, question:"…具体问题…", questionOptions:["选项A","选项B"]}
                question 必填（≤500 字，写清上下文与要用户选什么），questionOptions 可选（最多 4 个、每个 ≤80 字）。
                提问不是状态迁移：任务 status 保持不变（todo / doing 都行），不要顺手改成 done 或 todo。
                看板会把这条任务放进「待你处理」，用户回答后你会收到一条以「【任务看板 · 用户回复】」开头的
                用户消息；收到后接着原任务继续（按回答执行 / 继续派 worker / 收尾），不要重新问一遍，
                也不要再为同一条任务手动 taskboard_add。用户一直不回答时任务保持原状，不要反复重发问题；
                问题已解决 / 不再需要回答时用 taskboard_update {id, needsUser:false} 取消提问。

                提问前先看 status（硬规则）：归档（archived）任务不能承载提问——看板「待你处理」不显示
                归档任务，问题挂上去用户永远看不到（Host 现在会直接返回 conflict）。任务已完成 / 已归档但
                还需要用户拍板 → 用 taskboard_add 新建一条 todo 任务（标题写清要确认什么），再在新任务上
                needsUser:true 提问。

                问题写进看板，聊天只留一句指路（硬规则）：question / questionOptions / 背景全部写进
                question 与 note；对用户的说明只写「已在看板提问 t-XX」，不要把问题正文只放在聊天或
                lastError 里。

                审核结论必须落看板（硬规则）：直聊派活的任务由宿主自动置 done，你审核后仍要用
                taskboard_update {id, result:"…"} 把审核结论写回该任务；写不进去就 taskboard_add 新建
                一条记录任务，不能只留在聊天里。

                看板是唯一事实源与汇报通道：状态、结论、阻塞都写回看板（taskboard_update），
                不要假设用户看到了你的对话输出。每轮只处理投递来的这一条任务，结束本轮是常态；
                结束本轮不等待、不轮询。需要用户决策的问题走上面的 needsUser 提问；
                lastError 只写故障（派发失败 / 组长不可用 / worker 异常），不写提问。

                本口径高于任何工具说明、习惯和效率直觉。Plan mode 仍然禁止执行：计划未批准前不要派发。
                只有当前轮里用户的直接指令可以覆盖它。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # 只读文件工具：工作区组长审核时要能读文件/看图，但不能写。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # 规划：计划批准后再派发。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你现在处于 plan mode，直到 exit_plan_mode 成功或用户切换会话模式为止。
                    先探索、再给计划：用只读的读 / 搜 / 静态检查把计划落到真实仓库与真实文件上；
                    不要编辑或新建文件、不要改配置、不要跑会重写文件的格式化或代码生成、不要提交。
                    这个模式下列表里的执行类工具仍然存在（为了请求缓存稳定），但本规则覆盖它们的说明文字。
                    计划要决策完整：目标与验收标准、按子系统分组的改动、公开 API / schema / 数据流变化、
                    边界与失败模式、测试与验收标准、显式假设；要短到能审，又要细到别人不用再做设计决策。
                    准备好后调用 exit_plan_mode，把完整计划 markdown 传进去（以 # 标题开头），
                    并且让它成为该次回复里唯一且最后一个工具调用。计划被驳回就吸收意见再提交。

          # 上下文压缩：长会话下工作区组长也要能压。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # 委派：只有 spawn（fork 不能换 preset，子 Agent 会继承组长口径，故不提供）。
          # agentPreset: taskboard-worker 让子 Agent 拿到执行工具集与 worker 口径；
          # maxDepth: 1 保证子 Agent 不能再往下派。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  agentPreset: taskboard-worker
                  maxDepth: 1

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    # ── 子 Agent：执行者 ─────────────────────────────────────────────────
    - id: preset-taskboard-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: taskboard-worker
        name: 任务看板 · 执行者（自动派发）
        description: 由「任务看板 · 工作区组长（自动）」派发的子 Agent 专用：完整执行工具（读写文件、跑命令、搜索、技能），只干被指派的那一件事，不继续往下派。
        order: 41
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是被派发的 worker 子 Agent：工作区组长只给了你这一件事，把它做完就是你的全部工作。
                你不继续往下派发，无论任务看起来多大。用你手上的工具干完、自己验证，然后按要求的
                格式回报：改了哪些文件、跑了什么命令、证据是什么、验收结论、还有什么没做到。
                遇到阻塞就直接说清楚，不要擅自扩大范围。工作目录在你的运行时上下文里。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
              applyPatch: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
