name: Publish to npm

# 触发：推一个 v* tag（例如 `npm version patch && git push --follow-tags`）。
# 流程：校验 tag 与 package.json 版本一致 → 跑测试 → npm publish（带 provenance）→ 建 GitHub Release。
#
# 认证方式（二选一，工作流都支持）：
#  A. 仓库 Secret `NPM_TOKEN`（npm Automation token）：存在时用它发布。
#  B. npm Trusted Publishing（OIDC，推荐、零 secret）：
#     npmjs.com → 包 → Settings → Publishing access → Trusted Publishers →
#     Provider: GitHub Actions / User: duanxiangchun / Repository: dsh-dispatch-board /
#     Workflow: publish.yml / Environment: 留空。
#     注意：新包首次发布必须先手工 `npm publish` 一次，npm 上存在该包后才能配 Trusted Publisher。
#
# 本仓库实际走 A（GitHub 仓库 Secret `NPM_TOKEN` 已配置）：Actions 里的 `npm publish` 直接生效——
# 不需要本地 `npm login`、不需要 2FA、不需要 `npm stage approve`，也不用在 npmjs.com 点任何批准。
# 2026-11-11 发布 v0.1.3 实测：tag 推送后工作流 green，registry 几十秒内出现新版本。
# 只有改用 B（OIDC / Trusted Publishing）时才可能需要额外审批；届时以该路径的实际提示为准。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包校验，不真正发布
        type: boolean
        default: false

permissions:
  contents: write # 建 GitHub Release
  id-token: write # npm provenance / Trusted Publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Unit tests
        run: node --test

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Publish with NPM_TOKEN
        if: env.NODE_AUTH_TOKEN != '' && github.event.inputs.dry_run != 'true'
        run: npm publish --access public --provenance

      - name: Publish with Trusted Publishing (OIDC, no token)
        if: env.NODE_AUTH_TOKEN == '' && github.event.inputs.dry_run != 'true'
        run: |
          # setup-node 写进 .npmrc 的 _authToken 引用的是 NODE_AUTH_TOKEN；这里清空让它走 OIDC。
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
