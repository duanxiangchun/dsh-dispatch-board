name: Publish to npm

# 触发：推一个 v* tag（例如 `npm version patch && git push --follow-tags`）。
# 流程：校验 tag 与 package.json 版本一致 → 跑测试 → npm publish（带 provenance）→ 建 GitHub Release。
#
# 认证：npm Trusted Publishing（OIDC），零 secret。
# 一次性配置：npmjs.com → 包 dsh-dispatch-board → Settings → Trusted Publishers →
#   Provider: GitHub Actions / User: duanxiangchun / Repository: dsh-dispatch-board /
#   Workflow: publish.yml / Environment: 留空，勾选 Allow npm publish。
#
# npm 对来自 CI 的发布启用了 Staged publishing：上传后需维护者带 2FA 在 npmjs.com
# 「Staged publishes」批准，或本地执行 `npm stage approve <pkg>@<version>`。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包校验，不真正发布
        type: boolean
        default: false

permissions:
  contents: write # 建 GitHub Release
  id-token: write # npm provenance / Trusted Publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Unit tests
        run: node --test

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
